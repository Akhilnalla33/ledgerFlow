name: ledgerflow

services:
  postgres:
    image: postgres:16-alpine
    environment:
      POSTGRES_USER: ledgerflow
      POSTGRES_PASSWORD: ledgerflow
      POSTGRES_DB: ledgerflow
    ports:
      - "5432:5432"
    volumes:
      - pgdata:/var/lib/postgresql/data
      - ./scripts/init-multiple-dbs.sh:/docker-entrypoint-initdb.d/init-multiple-dbs.sh:ro
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ledgerflow"]
      interval: 5s
      timeout: 5s
      retries: 10

  kafka:
    image: apache/kafka:3.8.0
    ports:
      - "9092:9092"
    environment:
      KAFKA_NODE_ID: 1
      KAFKA_PROCESS_ROLES: broker,controller
      KAFKA_LISTENERS: PLAINTEXT://0.0.0.0:9092,CONTROLLER://0.0.0.0:9093,INTERNAL://0.0.0.0:29092
      KAFKA_ADVERTISED_LISTENERS: PLAINTEXT://localhost:9092,INTERNAL://kafka:29092
      KAFKA_LISTENER_SECURITY_PROTOCOL_MAP: CONTROLLER:PLAINTEXT,PLAINTEXT:PLAINTEXT,INTERNAL:PLAINTEXT
      KAFKA_CONTROLLER_LISTENER_NAMES: CONTROLLER
      KAFKA_CONTROLLER_QUORUM_VOTERS: 1@kafka:9093
      KAFKA_INTER_BROKER_LISTENER_NAME: INTERNAL
      KAFKA_OFFSETS_TOPIC_REPLICATION_FACTOR: 1
      KAFKA_AUTO_CREATE_TOPICS_ENABLE: "true"
    healthcheck:
      test: ["CMD-SHELL", "/opt/kafka/bin/kafka-broker-api-versions.sh --bootstrap-server localhost:9092"]
      interval: 10s
      timeout: 10s
      retries: 10

  keycloak:
    image: quay.io/keycloak/keycloak:25.0
    command: ["start-dev", "--import-realm"]
    environment:
      KEYCLOAK_ADMIN: admin
      KEYCLOAK_ADMIN_PASSWORD: admin
    ports:
      - "8180:8080"
    volumes:
      - ./scripts/keycloak/realm-export.json:/opt/keycloak/data/import/realm-export.json:ro

  jaeger:
    image: jaegertracing/all-in-one:1.60
    environment:
      COLLECTOR_OTLP_ENABLED: "true"
    ports:
      - "16686:16686"   # UI
      - "4318:4318"     # OTLP HTTP

  prometheus:
    image: prom/prometheus:v2.55.1
    volumes:
      - ./observability/prometheus/prometheus.yml:/etc/prometheus/prometheus.yml:ro
    ports:
      - "9090:9090"

  grafana:
    image: grafana/grafana:11.2.0
    environment:
      GF_AUTH_ANONYMOUS_ENABLED: "true"
      GF_AUTH_ANONYMOUS_ORG_ROLE: Admin
    volumes:
      - ./observability/grafana/datasource.yml:/etc/grafana/provisioning/datasources/datasource.yml:ro
      - ./observability/ledgerflow-dashboard.json:/var/lib/grafana/dashboards/ledgerflow-dashboard.json:ro
    ports:
      - "3000:3000"
    depends_on:
      - prometheus

  account-service:
    build:
      context: .
      dockerfile: account-service/Dockerfile
    environment:
      DB_HOST: postgres
      DB_NAME: account_db
      DB_USER: ledgerflow
      DB_PASSWORD: ledgerflow
      KAFKA_BOOTSTRAP_SERVERS: kafka:29092
      OAUTH2_ISSUER_URI: http://keycloak:8080/realms/ledgerflow
      OTLP_ENDPOINT: http://jaeger:4318/v1/traces
    ports:
      - "8081:8081"
    depends_on:
      postgres:
        condition: service_healthy
      kafka:
        condition: service_healthy

  settlement-service:
    build:
      context: .
      dockerfile: settlement-service/Dockerfile
    environment:
      DB_HOST: postgres
      DB_NAME: settlement_db
      DB_USER: ledgerflow
      DB_PASSWORD: ledgerflow
      KAFKA_BOOTSTRAP_SERVERS: kafka:29092
      OAUTH2_ISSUER_URI: http://keycloak:8080/realms/ledgerflow
      ACCOUNT_SERVICE_BASE_URL: http://account-service:8081
      OTLP_ENDPOINT: http://jaeger:4318/v1/traces
    ports:
      - "8082:8082"
    depends_on:
      postgres:
        condition: service_healthy
      kafka:
        condition: service_healthy
      account-service:
        condition: service_started

  ledger-query-service:
    build:
      context: .
      dockerfile: ledger-query-service/Dockerfile
    environment:
      DB_HOST: postgres
      DB_NAME: ledger_query_db
      DB_USER: ledgerflow
      DB_PASSWORD: ledgerflow
      KAFKA_BOOTSTRAP_SERVERS: kafka:29092
      OAUTH2_ISSUER_URI: http://keycloak:8080/realms/ledgerflow
    ports:
      - "8083:8083"
    depends_on:
      postgres:
        condition: service_healthy
      kafka:
        condition: service_healthy

  notification-service:
    build:
      context: .
      dockerfile: notification-service/Dockerfile
    environment:
      KAFKA_BOOTSTRAP_SERVERS: kafka:29092
    ports:
      - "8084:8084"
    depends_on:
      kafka:
        condition: service_healthy

volumes:
  pgdata:

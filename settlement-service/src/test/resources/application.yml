spring:
  datasource:
    url: jdbc:h2:mem:settlement_test;MODE=PostgreSQL;DB_CLOSE_DELAY=-1
    username: sa
    password: sa
  jpa:
    hibernate:
      ddl-auto: create-drop
  flyway:
    enabled: false
  kafka:
    bootstrap-servers: ${spring.embedded.kafka.brokers:localhost:9092}

ledgerflow:
  account-service:
    base-url: http://localhost:0
  outbox:
    poll-interval-ms: 3600000

# Local-only profile for scripts/loadtest/run-load-test.sh. Never used in docker-compose or any
# deployed environment. H2 in-memory instead of Postgres, and LoadTestSecurityConfig
# (permitAll) instead of requiring a real OAuth2 issuer, purely so k6 can hit a real, running
# account-service without standing up Keycloak just to mint load-test tokens.
spring:
  autoconfigure:
    # Prevents Spring Boot from trying to fetch OIDC discovery metadata from the (not running,
    # in this profile) OAuth2 issuer at startup — LoadTestSecurityConfig doesn't need a
    # JwtDecoder at all.
    exclude: org.springframework.boot.autoconfigure.security.oauth2.resource.servlet.OAuth2ResourceServerAutoConfiguration
  datasource:
    url: jdbc:h2:mem:loadtest;MODE=PostgreSQL;DB_CLOSE_DELAY=-1
    username: sa
    password: sa
  jpa:
    hibernate:
      ddl-auto: create-drop
  flyway:
    enabled: false
  kafka:
    bootstrap-servers: localhost:9092

ledgerflow:
  outbox:
    # No Kafka broker running for the load test; keep the outbox poller from spamming
    # connection-refused errors into the log every 500ms.
    poll-interval-ms: 3600000
